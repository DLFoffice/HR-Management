<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบริหารงานบุคคล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-logo" id="loginLogo">บค</div>
    <h1>ระบบบริหารงานบุคคล</h1>
    <div class="login-sub">เข้าสู่ระบบเพื่อดำเนินการต่อ</div>
    <div class="field full">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="loginUsername" placeholder="เลขบัตรประชาชน 13 หลัก หรือชื่อผู้ใช้แอดมิน">
    </div>
    <div class="field full">
      <label>รหัสผ่าน</label>
      <input type="password" id="loginPassword" placeholder="รหัสผ่าน">
    </div>
    <div class="field-error" id="loginError">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
    <button class="btn btn-primary" id="btnLoginSubmit" style="width:100%; justify-content:center; margin-top:6px;">เข้าสู่ระบบ</button>
    <div class="login-hint">
      <b>พนักงานทั่วไป:</b> ใช้เลขบัตรประชาชน 13 หลักเป็นทั้งชื่อผู้ใช้และรหัสผ่าน<br>
      <b>ผู้ดูแลระบบ:</b> ใช้บัญชีที่กำหนดไว้ในระบบ
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-seal" id="brandSeal">บค</div>
      <div class="brand-text">
        <div class="t1">ระบบบริหารงานบุคคล</div>
        <div class="t2">ปีงบประมาณ 2569</div>
      </div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div id="adminBadge" style="padding:0 20px 14px;"></div>
    <div class="sidebar-foot">
      สถานะเชื่อมต่อ Google Sheet
      <span class="sync-dot sync-none" id="syncDot"></span>
      <div id="syncText" style="margin-top:4px; color:#B9C3C7;">ยังไม่ได้ตั้งค่า</div>
    </div>
  </aside>

  <main id="main">
    <div id="viewRoot"></div>
  </main>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast"></div>

<div id="printArea"></div>

<div id="imgHoverPreview" style="display:none; position:fixed; z-index:300; pointer-events:none; background:#fff; padding:5px; border-radius:14px; box-shadow:0 18px 44px rgba(60,40,140,0.28); border:1px solid var(--line);">
  <img style="width:210px; height:210px; object-fit:cover; border-radius:10px; display:block;">
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage-sync.js"></script>
<script src="js/utils.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/nav-dashboard.js"></script>
<script src="js/employees-orgchart.js"></script>
<script src="js/leaves-loans.js"></script>
<script src="js/welfare-kpi-training.js"></script>
<script src="js/reports-selfservice.js"></script>
<script src="js/settings.js"></script>
<script src="js/app-events.js"></script>
</body>
</html>
