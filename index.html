<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบริหารงานบุคคล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --lav:#8B7FF0;
  --lav-2:#A79BFF;
  --lav-deep:#6558D3;
  --lav-bg:#EEEBFF;
  --mint:#4FD1B5;
  --mint-bg:#E1FAF3;
  --peach:#FF9F7A;
  --peach-bg:#FFEBE1;
  --pink:#FF8FB8;
  --pink-bg:#FFE8F1;
  --sun:#FFC24B;
  --sun-bg:#FFF3DA;
  --bg:#F7F6FD;
  --paper:#FFFFFF;
  --ink:#2C2A45;
  --ink-soft:#7B7897;
  --ink-faint:#A7A4C2;
  --line:#EAE7FA;
  --line-strong:#D9D4F5;
  --green:#37B893;
  --green-bg:#DEFBF3;
  --red:#FF6B7A;
  --red-bg:#FFE4E7;
  --amber:#F0A93F;
  --amber-bg:#FFF1DA;
  --radius:16px;
  --radius-sm:10px;
  --shadow-sm:0 2px 10px rgba(107,92,231,0.07);
  --shadow-md:0 10px 30px rgba(107,92,231,0.13);
  --shadow-lift:0 14px 34px rgba(107,92,231,0.20);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun',sans-serif;
  background:
    radial-gradient(900px 420px at 100% -10%, #EDE9FF 0%, rgba(237,233,255,0) 60%),
    radial-gradient(700px 380px at -5% 10%, #E2FBF4 0%, rgba(226,251,244,0) 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--lav-bg); color:var(--lav-deep);}
button, input, select, textarea{font-family:'Sarabun',sans-serif;}
a{color:var(--lav-deep);}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:236px; flex-shrink:0;
  background:linear-gradient(165deg, #7B6EF6 0%, #9C8CFF 55%, #B79BFF 100%);
  color:#F2EFFF;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  box-shadow:4px 0 24px rgba(107,92,231,0.18);
  z-index:5;
}
.brand{
  padding:24px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,0.18);
  display:flex; align-items:center; gap:12px;
}
.brand-seal{
  width:40px; height:40px; border-radius:14px;
  background:rgba(255,255,255,0.16);
  border:1px solid rgba(255,255,255,0.35);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; color:#fff;
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(60,40,140,0.18);
  transition:transform .35s var(--ease);
}
.brand:hover .brand-seal{transform:rotate(-8deg) scale(1.06);}
.brand-seal img{width:100%; height:100%; object-fit:contain; border-radius:10px; padding:3px;}
.brand-text{line-height:1.3;}
.brand-text .t1{font-size:14.5px; font-weight:600; color:#fff;}
.brand-text .t2{font-size:11.5px; color:#E3DEFF;}

nav.navlist{padding:16px 12px; flex:1;}
.navlist button{
  width:100%; text-align:right;
  background:none; border:none; color:#EDE9FF;
  padding:11px 14px; font-size:14.5px;
  display:flex; align-items:center; justify-content:flex-end; gap:10px;
  cursor:pointer; border-radius:12px;
  margin-bottom:4px;
  position:relative;
  transition:background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
}
.navlist button .idx{
  font-size:11px; color:rgba(255,255,255,0.55); min-width:16px; text-align:left; margin-right:auto;
  font-variant-numeric:tabular-nums;
  transition:color .25s var(--ease);
}
.navlist button:hover{background:rgba(255,255,255,0.14); transform:translateX(-2px);}
.navlist button.active{
  background:rgba(255,255,255,0.96); color:var(--lav-deep);
  box-shadow:0 8px 18px rgba(60,40,140,0.18);
  font-weight:600;
}
.navlist button.active .idx{color:var(--lav-2);}
.sidebar-foot{
  padding:16px 20px 20px; border-top:1px solid rgba(255,255,255,0.18);
  font-size:11.5px; color:#E3DEFF;
}
.sync-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px; position:relative; top:-1px;}
.sync-ok{background:#4FE3B0; box-shadow:0 0 0 0 rgba(79,227,176,.6); animation:pulseDot 1.8s infinite;}
.sync-bad{background:#FF8090;}
.sync-none{background:rgba(255,255,255,0.5);}
@keyframes pulseDot{
  0%{box-shadow:0 0 0 0 rgba(79,227,176,.55);}
  70%{box-shadow:0 0 0 7px rgba(79,227,176,0);}
  100%{box-shadow:0 0 0 0 rgba(79,227,176,0);}
}

/* ---------- Main ---------- */
#main{flex:1; min-width:0; padding:34px 42px 60px;}
.page-header{
  display:flex; justify-content:space-between; align-items:flex-end;
  padding-bottom:16px; margin-bottom:26px;
  border-bottom:1px solid var(--line-strong);
}
.page-header h1{
  font-size:23px; font-weight:700; margin:0 0 4px;
  color:var(--ink);
  letter-spacing:-.2px;
}
.page-header .sub{font-size:13px; color:var(--ink-soft);}
.page-header .actions{display:flex; gap:8px;}

.view{opacity:0;}
.view.active{
  display:block;
  animation:viewIn .38s var(--ease) forwards;
}
@keyframes viewIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.btn{
  border:1px solid var(--line-strong); background:var(--paper);
  color:var(--ink); padding:9px 17px; font-size:13.5px;
  border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
}
.btn:hover{border-color:var(--lav-2); color:var(--lav-deep); box-shadow:var(--shadow-sm); transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--lav) 0%, var(--lav-2) 100%); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(139,127,240,0.35);}
.btn-primary:hover{color:#fff; box-shadow:0 10px 26px rgba(139,127,240,0.45); transform:translateY(-2px);}
.btn-gold{background:linear-gradient(135deg, var(--peach) 0%, var(--sun) 100%); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(255,159,122,0.35);}
.btn-gold:hover{color:#fff; box-shadow:0 10px 26px rgba(255,159,122,0.45); transform:translateY(-2px);}
.btn-danger{color:var(--red); border-color:var(--red-bg);}
.btn-danger:hover{background:var(--red-bg); border-color:var(--red); box-shadow:none;}
.btn-sm{padding:6px 13px; font-size:12.5px;}
.btn:disabled{opacity:0.45; cursor:not-allowed; transform:none !important; box-shadow:none !important;}

.view{display:none;}
.view.active{display:block;}

/* ---------- Cards / stat tiles ---------- */
.grid{display:grid; gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(1,1fr);}}

.stat{
  background:var(--paper); border:1px solid var(--line);
  padding:18px 20px; border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  position:relative; overflow:hidden;
}
.stat::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--stat-accent, linear-gradient(90deg,var(--lav),var(--lav-2)));
}
.stat:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift);}
.stat:nth-child(1){--stat-accent:linear-gradient(90deg,#8B7FF0,#A79BFF);}
.stat:nth-child(2){--stat-accent:linear-gradient(90deg,#4FD1B5,#7EE8D0);}
.stat:nth-child(3){--stat-accent:linear-gradient(90deg,#FF9F7A,#FFC24B);}
.stat:nth-child(4){--stat-accent:linear-gradient(90deg,#FF8FB8,#FFB4D2);}
.stat .label{font-size:12px; color:var(--ink-soft); margin-bottom:8px; font-weight:500;}
.stat .value{font-size:29px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
.stat .foot{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

.panel{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px 24px; margin-bottom:20px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .3s var(--ease);
}
.panel:hover{box-shadow:var(--shadow-md);}
.panel h2{
  font-size:15.5px; font-weight:700; color:var(--ink);
  margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--line);
}

/* ---------- Tables ---------- */
table.reg{width:100%; border-collapse:collapse; font-size:13.5px;}
table.reg th{
  text-align:right; font-weight:600; color:var(--lav-deep);
  padding:10px 12px; border-bottom:2px solid var(--line);
  font-size:12.5px; white-space:nowrap;
}
table.reg td{
  padding:10px 12px; border-bottom:1px solid var(--line);
  vertical-align:middle;
}
table.reg tbody tr{transition:background .18s var(--ease);}
table.reg tbody tr:hover{background:var(--lav-bg);}
table.reg tbody tr.row-clickable{cursor:pointer;}
table.reg .num{font-variant-numeric:tabular-nums; text-align:left;}
table.reg .rownum{color:var(--ink-faint); font-size:12px; width:30px; text-align:left;}
.table-wrap{overflow-x:auto;}
.empty-row td{text-align:center; color:var(--ink-soft); padding:30px; font-size:13.5px;}

.tag{
  display:inline-block; padding:3px 11px; border-radius:20px;
  font-size:11.5px; font-weight:600;
}
.tag-green{background:var(--green-bg); color:var(--green);}
.tag-red{background:var(--red-bg); color:var(--red);}
.tag-amber{background:var(--amber-bg); color:var(--amber);}
.tag-navy{background:var(--lav-bg); color:var(--lav-deep);}

.searchbar{display:flex; gap:10px; margin-bottom:16px;}
.searchbar input, .searchbar select{
  border:1px solid var(--line-strong); border-radius:12px;
  padding:9px 14px; font-size:13.5px; background:#FBFAFF; color:var(--ink);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.searchbar input:focus, .searchbar select:focus{
  outline:none; border-color:var(--lav-2); box-shadow:0 0 0 3px var(--lav-bg); background:#fff;
}
.searchbar input{flex:1; min-width:160px;}

/* ---------- Modal / Forms ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(60,50,110,0.35);
  backdrop-filter:blur(3px);
  display:none; align-items:flex-start; justify-content:center;
  padding:40px 20px; z-index:100; overflow-y:auto;
}
.overlay.active{display:flex; animation:overlayIn .25s var(--ease);}
@keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
.modal{
  background:var(--paper); width:100%; max-width:660px;
  border-radius:20px;
  padding:26px 30px 30px;
  box-shadow:0 30px 70px rgba(60,40,140,0.28);
  animation:modalIn .32s var(--ease);
}
@keyframes modalIn{
  from{opacity:0; transform:translateY(16px) scale(.97);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
.modal h3{margin:0 0 18px; font-size:18px; color:var(--ink); font-weight:700;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
.field{margin-bottom:12px;}
.field.full{grid-column:1/-1;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500;}
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line-strong); border-radius:11px;
  padding:9px 12px; font-size:14px; background:#FBFAFF; color:var(--ink);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--lav-2); box-shadow:0 0 0 3px var(--lav-bg); background:#fff;
}
.field textarea{resize:vertical; min-height:56px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);}
.field-error{color:var(--red); font-size:12px; margin-top:4px; display:none;}

/* ---------- Settings ---------- */
.setting-row{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
.setting-row input{flex:1;}
.status-line{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-top:6px;}
.steps ol{margin:0; padding-right:0; padding-left:20px; font-size:13.5px; color:var(--ink-soft);}
.steps li{margin-bottom:7px;}
code.inline{background:var(--lav-bg); color:var(--lav-deep); padding:2px 7px; border-radius:6px; font-size:12.5px;}

/* ---------- Toast ---------- */
#toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg, var(--lav) 0%, var(--lav-2) 100%); color:#fff;
  padding:12px 22px; border-radius:999px;
  font-size:13.5px; display:none; z-index:200;
  box-shadow:0 14px 32px rgba(107,92,231,0.35);
  opacity:0;
}
#toast.show{display:block; animation:toastIn .38s var(--ease) forwards;}
@keyframes toastIn{
  from{opacity:0; transform:translateX(-50%) translateY(20px);}
  to{opacity:1; transform:translateX(-50%) translateY(0);}
}

/* ---------- Print ---------- */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px;}
}
.doc-header{text-align:center; border-bottom:2px solid var(--lav-deep); padding-bottom:12px; margin-bottom:18px;}
.doc-header .org{font-size:14px; color:var(--ink-soft);}
.doc-header .title{font-size:19px; font-weight:700; color:var(--ink); margin-top:4px;}
.doc-meta{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:13.5px; margin-bottom:18px;}
.doc-meta div span.k{color:var(--ink-soft);}
.doc-section-title{font-size:14px; font-weight:700; color:var(--ink); margin:18px 0 8px; border-bottom:1px solid var(--line-strong); padding-bottom:5px;}

.pill-nav{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.pill-nav button{
  border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-soft);
  padding:8px 18px; border-radius:999px; font-size:13px; cursor:pointer; font-weight:500;
  transition:all .22s var(--ease);
}
.pill-nav button:hover{border-color:var(--lav-2); color:var(--lav-deep); transform:translateY(-1px);}
.pill-nav button.active{background:linear-gradient(135deg, var(--lav) 0%, var(--lav-2) 100%); color:#fff; border-color:transparent; box-shadow:0 8px 18px rgba(139,127,240,0.3);}

/* ---------- Progress bar (leave / welfare remaining) ---------- */
.pbar{background:var(--line); border-radius:999px; height:7px; overflow:hidden; margin-top:6px;}
.pbar > div{height:100%; border-radius:999px; transition:width .6s var(--ease); background:linear-gradient(90deg,var(--lav),var(--mint));}

.muted{color:var(--ink-soft);}
.right{text-align:left;}
.hidden{display:none !important;}

@media(max-width:900px){
  #sidebar{width:210px;}
  #main{padding:24px 20px 50px;}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-seal" id="brandSeal">บค</div>
      <div class="brand-text">
        <div class="t1">ระบบบริหารงานบุคคล</div>
        <div class="t2">ปีงบประมาณ 2569</div>
      </div>

    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">

      <span class="sync-dot sync-none" id="syncDot"></span>

  <main id="main">

</div>

<div class="overlay" id="modalOverlay">

</div>

<div id="toast"></div>

<div id="printArea"></div>

  <img style="width:210px; height:210px; object-fit:cover; border-radius:10px; display:block;">
</div>

/* ---------------- Storage helpers ---------------- */
async function loadPersisted(){
  try{
    const s = await window.storage.get('settings', false);
    if(s && s.value) state.settings = Object.assign({}, state.settings, JSON.parse(s.value));
  }catch(e){}
  try{
    const c = await window.storage.get('cache', false);
    if(c && c.value){
      const data = JSON.parse(c.value);
      state.employees = data.employees || [];
      state.leaves = data.leaves || [];
      state.loans = data.loans || [];
      state.welfare = data.welfare || [];
      state.lastSync = data.lastSync || null;
    }
  }catch(e){}
}
async function saveSettings(){
  try{ await window.storage.set('settings', JSON.stringify(state.settings), false); }catch(e){}
}
async function saveCache(){
  try{
    await window.storage.set('cache', JSON.stringify({
      employees: state.employees, leaves: state.leaves, loans: state.loans,
      welfare: state.welfare, lastSync: state.lastSync
    }), false);

/* ---------------- GAS sync ---------------- */
function gasReady(){ return !!state.settings.gasUrl; }

async function gasGet(action){
  const url = state.settings.gasUrl + (state.settings.gasUrl.includes('?') ? '&' : '?') + 'action=' + action;
  const res = await fetch(url);
  if(!res.ok) throw new Error('เชื่อมต่อไม่สำเร็จ (' + res.status + ')');
  return res.json();
}
async function gasPost(body){
  const res = await fetch(state.settings.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('บันทึกไม่สำเร็จ (' + res.status + ')');
  return res.json();
}

async function syncFromSheet(showToast){
  if(!gasReady()){ updateSyncStatus('none'); return; }
  updateSyncStatus('syncing');
  try{
    const data = await gasGet('getAll');
    if(data.error) throw new Error(data.error);
    state.employees = data.employees || [];
    state.leaves = data.leaves || [];
    state.loans = data.loans || [];
    state.welfare = data.welfare || [];
    state.lastSync = new Date().toISOString();
    await saveCache();
    updateSyncStatus('ok');
    if(showToast) toast('ซิงค์ข้อมูลจาก Google Sheet สำเร็จ');
    renderView();
  }catch(e){
    updateSyncStatus('bad');
    if(showToast) toast('ซิงค์ไม่สำเร็จ: ' + e.message);
  }
}

function updateSyncStatus(kind){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(kind==='none'){ dot.className='sync-dot sync-none'; text.textContent='ยังไม่ได้ตั้งค่า'; }
  else if(kind==='syncing'){ dot.className='sync-dot sync-none'; text.textContent='กำลังซิงค์...'; }
  else if(kind==='ok'){ dot.className='sync-dot sync-ok'; text.textContent='เชื่อมต่อแล้ว · ' + (state.lastSync? fmtDateTime(state.lastSync):''); }
  else if(kind==='bad'){ dot.className='sync-dot sync-bad'; text.textContent='เชื่อมต่อล้มเหลว'; }
}

async function crudAdd(sheet, data){

  renderView(); await saveCache();

async function crudUpdate(sheet, data){
  const idx = state[sheet].findIndex(r=>r.id===data.id);
  if(idx>-1) state[sheet][idx] = data;
  renderView(); await saveCache();
  if(gasReady()){
    try{ await gasPost({action:'update', sheet, data}); toast('แก้ไขข้อมูลแล้ว'); }

  }
}
async function crudDelete(sheet, id){
  state[sheet] = state[sheet].filter(r=>r.id!==id);
  renderView(); await saveCache();
  if(gasReady()){
    try{ await gasPost({action:'delete', sheet, id}); toast('ลบข้อมูลแล้ว'); }

  } else {
    toast('ลบข้อมูลในระบบแล้ว');
  }
}

/* ---------------- Cloudinary image upload ---------------- */
function cloudinaryReady(){ return !!(state.settings.cloudinaryCloud && state.settings.cloudinaryPreset); }

async function uploadToCloudinary(file, onProgress){
  if(!cloudinaryReady()) throw new Error('ยังไม่ได้ตั้งค่า Cloudinary (Cloud name / Upload preset) ในหน้าตั้งค่า');
  const url = `https://api.cloudinary.com/v1_1/${state.settings.cloudinaryCloud}/image/upload`;
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', state.settings.cloudinaryPreset);
  return new Promise((resolve, reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = (e)=>{
      if(onProgress && e.lengthComputable) onProgress(Math.round((e.loaded/e.total)*100));
    };
    xhr.onload = ()=>{
      try{
        const data = JSON.parse(xhr.responseText);
        if(data.secure_url) resolve(data.secure_url);
        else reject(new Error(data.error?.message || 'อัปโหลดไม่สำเร็จ'));
      }catch(e){ reject(new Error('อัปโหลดไม่สำเร็จ')); }
    };
    xhr.onerror = ()=> reject(new Error('เชื่อมต่อ Cloudinary ไม่สำเร็จ'));
    xhr.send(formData);
  });
}

document.addEventListener('mouseover', (e)=>{
  const img = e.target.closest && e.target.closest('.avatar-thumb');
  if(!img) return;
  const preview = document.getElementById('imgHoverPreview');
  if(!preview) return;
  preview.innerHTML = `<img src="${img.src}" style="width:210px; height:210px; object-fit:cover; border-radius:10px; display:block;">`;
  preview.style.display = 'block';
});
document.addEventListener('mousemove', (e)=>{
  const preview = document.getElementById('imgHoverPreview');
  if(!preview || preview.style.display!=='block') return;
  let x = e.clientX + 22, y = e.clientY + 22;
  const maxX = window.innerWidth - 230;
  const maxY = window.innerHeight - 230;
  if(x>maxX) x = e.clientX - 230;
  if(y>maxY) y = e.clientY - 230;
  preview.style.left = Math.max(x,8)+'px';
  preview.style.top = Math.max(y,8)+'px';
});
document.addEventListener('mouseout', (e)=>{
  const img = e.target.closest && e.target.closest('.avatar-thumb');
  if(!img) return;
  const preview = document.getElementById('imgHoverPreview');
  if(preview) preview.style.display = 'none';
});

/* ---------------- Utilities ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show'); void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 3200);
}
function animateValue(el, to, decimals, suffix){
  if(!el) return;
  const from = 0;
  const dur = 700;
  const t0 = performance.now();
  function step(t){
    const p = Math.min((t-t0)/dur, 1);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (to-from)*eased;
    el.textContent = (decimals? val.toFixed(decimals) : Math.round(val)).toLocaleString('th-TH') + (suffix||'');
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function esc(s){ return (s===undefined||s===null)? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function buddhistDate(dstr){
  if(!dstr) return '-';
  const d = new Date(dstr);
  if(isNaN(d)) return dstr;
  try{
    return new Intl.DateTimeFormat('th-TH-u-ca-buddhist',{day:'2-digit',month:'short',year:'numeric'}).format(d);
  }catch(e){ return dstr; }
}
function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function money(n){
  n = Number(n)||0;
  return n.toLocaleString('th-TH',{maximumFractionDigits:2});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function fiscalYearRange(ref){
  const d = ref ? new Date(ref) : new Date();
  const y = d.getFullYear();
  let start, end;
  if(d.getMonth() >= 9){ start = new Date(y,9,1); end = new Date(y+1,8,30); }
  else { start = new Date(y-1,9,1); end = new Date(y,8,30); }
  return {start, end};
}
function inRange(dateStr, start, end){
  const d = new Date(dateStr);
  return d>=start && d<=end;
}

function employeeById(id){ return state.employees.find(e=>e.id===id); }
function employeeName(emp){ return emp ? emp.name : ''; }

function ageFromDate(dstr, refDate){
  if(!dstr) return '-';
  const b = new Date(dstr); const r = refDate || new Date();
  let years = r.getFullYear()-b.getFullYear();
  let months = r.getMonth()-b.getMonth();
  if(r.getDate() < b.getDate()) months--;
  if(months<0){ years--; months+=12; }
  return years + ' ปี ' + months + ' เดือน';
}

  const leaveDaysTotal = leavesFY.reduce((s,l)=>s+Number(l.days||0),0);

  leavesFY.forEach(l=>{ if(leaveByType[l.leaveType]!==undefined) leaveByType[l.leaveType]+=Number(l.days||0); });

  const loanOutstanding = activeLoans.reduce((s,l)=>{

    return s + Math.max(Number(l.approvedAmount||0)-paid,0);
  },0);

  const welfareFY = state.welfare.filter(w=>w.submitDate && inRange(w.submitDate, fy.start, fy.end));

    <div class="stat"><div class="label">วันลาสะสม (ปีงบประมาณนี้)</div><div class="value" id="statLeave" data-to="${leaveDaysTotal}" data-dec="1">0</div><div class="foot">วัน จากทั้งหมด ${leavesFY.length} รายการ</div></div>
    <div class="stat"><div class="label">เงินกู้คงค้าง</div><div class="value" id="statLoan" data-to="${loanOutstanding}" data-dec="0">0</div><div class="foot">${activeLoans.length} สัญญาที่ยังผ่อนอยู่</div></div>
    <div class="stat"><div class="label">สวัสดิการเบิกใช้ (ปีงบนี้)</div><div class="value" id="statWelfare" data-to="${welfareUsed}" data-dec="0">0</div><div class="foot">${welfareFY.length} รายการเบิก</div></div>
  </div>

  <div class="grid grid-2" style="align-items:start;">
    <div class="panel">

      <div style="position:relative; height:220px;">
        <canvas id="chartLeaveType" role="img" aria-label="กราฟแท่งแสดงจำนวนวันลาแยกตามประเภท">ลาป่วย ${leaveByType['ป']} วัน, ลาพักผ่อน ${leaveByType['พ']} วัน, ลากิจ ${leaveByType['ก']} วัน</canvas>
      </div>
    </div>
    <div class="panel">
      <h2>พนักงานแยกตามกลุ่มงาน</h2>
      <div style="position:relative; height:220px;">
        <canvas id="chartDept" role="img" aria-label="กราฟแท่งแสดงจำนวนพนักงานแยกตามกลุ่มงาน">${Object.entries(byDept).map(([k,v])=>k+' '+v+' คน').join(', ')}</canvas>

  <div class="grid grid-3" style="align-items:start;">

      ${birthdays.length? birthdays.map(e=>`
        <div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;">
          <span>${esc(e.name)}</span><span class="muted">${new Date(e.birthDate).getDate()} ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][new Date(e.birthDate).getMonth()]}</span>

function renderDashboardCharts(){
  const fy = fiscalYearRange();
  const leavesFY = state.leaves.filter(l=>l.startDate && inRange(l.startDate, fy.start, fy.end));
  const leaveByType = {'ป':0,'พ':0,'ก':0};
  leavesFY.forEach(l=>{ if(leaveByType[l.leaveType]!==undefined) leaveByType[l.leaveType]+=Number(l.days||0); });

  const c1 = document.getElementById('chartLeaveType');
  if(c1){
    if(charts.leaveType) charts.leaveType.destroy();
    charts.leaveType = new Chart(c1, {
      type:'bar',
      data:{ labels:['ลาป่วย','ลาพักผ่อน','ลากิจ'], datasets:[{ label:'วันลา', data:[leaveByType['ป'],leaveByType['พ'],leaveByType['ก']], backgroundColor:['#16303C','#B08A3E','#3F6B4E'], borderRadius:3, maxBarThickness:46 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}} } }
    });
  }
  const byDept = {};
  state.employees.forEach(e=>{ byDept[e.department||'ไม่ระบุ'] = (byDept[e.department||'ไม่ระบุ']||0)+1; });
  const c2 = document.getElementById('chartDept');
  if(c2){
    if(charts.dept) charts.dept.destroy();
    charts.dept = new Chart(c2, {
      type:'bar',
      data:{ labels:Object.keys(byDept), datasets:[{ label:'จำนวนพนักงาน', data:Object.values(byDept), backgroundColor:'#1F4152', borderRadius:3, maxBarThickness:46 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{beginAtZero:true, ticks:{precision:0}} } }
    });
  }
}

function employeeRows(){
  const q = (document.getElementById('empSearch')?.value||'').trim().toLowerCase();
  const dept = document.getElementById('empDeptFilter')?.value||'';
  return state.employees.filter(e=>{
    const matchQ = !q || [e.code,e.name,e.position].some(v=>String(v||'').toLowerCase().includes(q));
    const matchD = !dept || e.department===dept;
    return matchQ && matchD;
  });
}

function renderEmployeeTable(){
  const tbody = document.querySelector('#empTable tbody');
  if(!tbody) return;
  const rows = employeeRows();
  tbody.innerHTML = rows.length ? rows.map((e,i)=>`
    <tr class="row-clickable" data-emp-id="${e.id}">

function openEmployeeDetailModal(id){
  const emp = employeeById(id);
  if(!emp) return;
  const summary = computeEmployeeSummary(id);
  openModal(`
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:4px;">
      <div style="display:flex; align-items:center; gap:16px;">
        ${avatarHtml(emp,72)}
        <div>
          <h3 style="margin:0 0 3px;">${esc(emp.name)}</h3>
          <div class="muted" style="font-size:13px;">${esc(emp.position)} ${emp.department? '· '+esc(emp.department):''}</div>
        </div>
      </div>
    </div>
    <div style="max-height:56vh; overflow-y:auto; overflow-x:auto; margin-top:16px; padding-right:4px;">
      ${individualReportHtml(summary, false, true)}
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnCancelModal">ปิด</button>
      <button class="btn btn-primary" id="btnEditFromDetail">แก้ไขข้อมูลพนักงาน</button>
    </div>
  `, 760);
  document.getElementById('btnEditFromDetail').addEventListener('click', ()=>{ closeModal(); openEmployeeModal(id); });

function openEmployeeModal(id){
  const emp = id ? employeeById(id) : null;
  openModal(employeeFormHtml(emp));
  document.getElementById('f_photoFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('f_photoStatus');
    if(!cloudinaryReady()){ toast('กรุณาตั้งค่า Cloudinary ในหน้าตั้งค่าก่อนอัปโหลดรูป'); return; }
    statusEl.textContent = 'กำลังอัปโหลด... 0%';
    try{
      const url = await uploadToCloudinary(file, (p)=>{ statusEl.textContent = 'กำลังอัปโหลด... '+p+'%'; });
      document.getElementById('f_photoUrl').value = url;
      document.getElementById('empPhotoPreview').innerHTML = `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
      statusEl.textContent = 'อัปโหลดสำเร็จ';
    }catch(err){
      statusEl.textContent = '';
      toast('อัปโหลดไม่สำเร็จ: '+err.message);
    }
  });
  document.getElementById('btnSaveEmp').addEventListener('click', ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ document.getElementById('f_error').style.display='block'; return; }
    const data = {
      id: emp? emp.id : undefined,
      code: document.getElementById('f_code').value.trim(),
      name,
      position: document.getElementById('f_position').value.trim(),
      department: document.getElementById('f_department').value.trim(),
      birthDate: document.getElementById('f_birthDate').value,
      hireDate: document.getElementById('f_hireDate').value,
      retireDate: document.getElementById('f_retireDate').value,
      sickRight: Number(document.getElementById('f_sickRight').value||0),
      vacationRight: Number(document.getElementById('f_vacationRight').value||0),
      personalRight: Number(document.getElementById('f_personalRight').value||0),
      carrySick: Number(document.getElementById('f_carrySick').value||0),
      carryVacation: Number(document.getElementById('f_carryVacation').value||0),
      carryPersonal: Number(document.getElementById('f_carryPersonal').value||0),
      welfareLimit: Number(document.getElementById('f_welfareLimit').value||0),
      loanNormalLimit: Number(document.getElementById('f_loanNormalLimit').value||0),
      loanEmergencyLimit: Number(document.getElementById('f_loanEmergencyLimit').value||0),
      dentalFilling: Number(document.getElementById('f_dentalFilling').value||0),
      dentalSurgery: Number(document.getElementById('f_dentalSurgery').value||0),
      dentalImplant: Number(document.getElementById('f_dentalImplant').value||0),
      denture: Number(document.getElementById('f_denture').value||0),
      photoUrl: document.getElementById('f_photoUrl').value.trim()
    };
    closeModal();
    if(emp) crudUpdate('employees', data); else crudAdd('employees', data);
  });
}

/* ================= REPORTS ================= */
function computeEmployeeSummary(empId){
  const emp = employeeById(empId);
  if(!emp) return null;
  const fy = fiscalYearRange();
  const leaves = state.leaves.filter(l=>l.employeeId===empId && l.startDate && inRange(l.startDate, fy.start, fy.end));
  const used = {'ป':0,'พ':0,'ก':0};
  leaves.forEach(l=>{ if(used[l.leaveType]!==undefined) used[l.leaveType]+=Number(l.days||0); });
  const leaveSummary = [
    {label:'ลาป่วย', right:Number(emp.sickRight||0), carry:Number(emp.carrySick||0), used:used['ป']},
    {label:'ลาพักผ่อน', right:Number(emp.vacationRight||0), carry:Number(emp.carryVacation||0), used:used['พ']},
    {label:'ลากิจ', right:Number(emp.personalRight||0), carry:Number(emp.carryPersonal||0), used:used['ก']}
  ].map(r=>({...r, total:r.right+r.carry, remaining:r.right+r.carry-r.used}));

  const loans = state.loans.filter(l=>l.employeeId===empId);
  const loanSummary = LOAN_TYPES.map(type=>{
    const active = loans.filter(l=>l.loanType===type && (l.status||'active')==='active');
    const current = active.reduce((s,l)=>s+loanRemaining(l),0);
    const limit = type==='เงินกู้สามัญ' ? Number(emp.loanNormalLimit||0) : Number(emp.loanEmergencyLimit||0);
    return {label:type, limit, current};
  });

  const welfare = state.welfare.filter(w=>w.employeeId===empId && w.submitDate && inRange(w.submitDate, fy.start, fy.end));
  const welfareSummary = WELFARE_CATS.map(c=>{
    const usedAmt = welfare.filter(w=>w.category===c.label).reduce((s,w)=>s+Number(w.approvedAmount||0),0);
    const limit = Number(emp[c.limitField]||0);
    return {label:c.label, limit, used:usedAmt, remaining: Math.max(limit-usedAmt,0)};
  });

  return {emp, leaveSummary, loanSummary, welfareSummary, fy};
}

function renderReportOverall(){
  const body = document.getElementById('reportBody');
  const fy = fiscalYearRange();
  const rows = state.employees.map(e=>{
    const s = computeEmployeeSummary(e.id);
    const totalUsed = s.leaveSummary.reduce((a,r)=>a+r.used,0);
    const totalRemaining = s.leaveSummary.reduce((a,r)=>a+r.remaining,0);
    const loanCurrent = s.loanSummary.reduce((a,r)=>a+r.current,0);
    const welfareUsed = s.welfareSummary.reduce((a,r)=>a+r.used,0);
    return {e, totalUsed, totalRemaining, loanCurrent, welfareUsed};
  });
  body.innerHTML = `
  <div class="panel">
    <div class="searchbar"><div class="muted" style="flex:1; font-size:13.5px;">ปีงบประมาณ ${fy.start.getFullYear()+543}-${fy.end.getFullYear()+543}</div>

    <div class="table-wrap" id="overallTableWrap">${overallReportHtml(rows, fy)}</div>
  </div>`;
  document.getElementById('btnPrintOverall').addEventListener('click', ()=> printDocument(overallReportHtml(rows, fy, true)));
}

async function importSeedDataGeneric(list, label){
  if(state.employees.length > 0){
    if(!confirm('ระบบมีข้อมูลพนักงานอยู่แล้ว ('+state.employees.length+' คน) การนำเข้าจะเพิ่มข้อมูลชุด "'+label+'" ต่อท้าย อาจมีชื่อซ้ำกันได้ ต้องการดำเนินการต่อหรือไม่?')) return;
  }
  toast('กำลังนำเข้าข้อมูล...');
  state.employees.push(...list);
  await saveCache();
  renderView();
  if(gasReady()){
    try{
      for(const e of list) await gasPost({action:'add', sheet:'employees', data:e});
      toast('นำเข้า '+list.length+' รายการ และส่งขึ้น Google Sheet สำเร็จ');
    }catch(e){
      toast('นำเข้าข้อมูลในระบบสำเร็จ แต่ส่งขึ้น Google Sheet ไม่สำเร็จ: '+e.message);
    }
  } else {
    toast('นำเข้า '+list.length+' รายการสำเร็จ (ยังไม่ได้เชื่อมต่อ Google Sheet)');
  }
}

  if(state.employees.length > 0){

/* ================= MODAL HELPERS ================= */
function openModal(html, maxWidth){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBox').style.maxWidth = maxWidth ? maxWidth+'px' : '';
  document.getElementById('modalOverlay').classList.add('active');
  const cancelBtn = document.getElementById('btnCancelModal');
  if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalBox').innerHTML = '';
}

/* ================= EVENT BINDING PER VIEW ================= */
function bindViewEvents(v){
  if(v==='dashboard'){
    document.getElementById('btnSyncTop')?.addEventListener('click', ()=>syncFromSheet(true));
  }
  else if(v==='employees'){
    document.getElementById('btnAddEmp')?.addEventListener('click', ()=>openEmployeeModal(null));
    document.getElementById('empSearch')?.addEventListener('input', renderEmployeeTable);
    document.getElementById('empDeptFilter')?.addEventListener('change', renderEmployeeTable);
    renderEmployeeTable();
  }
  else if(v==='leaves'){
    document.getElementById('btnAddLeave')?.addEventListener('click', ()=>openLeaveModal(null));
    document.getElementById('leaveSearch')?.addEventListener('input', renderLeaveTable);
    document.getElementById('leaveTypeFilter')?.addEventListener('change', renderLeaveTable);
    renderLeaveTable();
  }
  else if(v==='loans'){
    document.getElementById('btnAddLoan')?.addEventListener('click', ()=>openLoanModal(null));
    document.getElementById('loanSearch')?.addEventListener('input', renderLoanTable);
    document.getElementById('loanStatusFilter')?.addEventListener('change', renderLoanTable);
    renderLoanTable();
  }
  else if(v==='welfare'){
    document.getElementById('btnAddWelfare')?.addEventListener('click', ()=>openWelfareModal(null));
    document.getElementById('welfSearch')?.addEventListener('input', renderWelfareTable);
    document.getElementById('welfCatFilter')?.addEventListener('change', renderWelfareTable);
    renderWelfareTable();
  }
  else if(v==='reports'){
    const pills = document.querySelectorAll('[data-report]');
    pills.forEach(p=>p.addEventListener('click', ()=>{
      pills.forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      if(p.dataset.report==='individual') renderReportIndividual(); else renderReportOverall();
    }));
    renderReportIndividual();
  }
  else if(v==='settings'){
    document.getElementById('btnSaveUrl')?.addEventListener('click', async ()=>{
      state.settings.gasUrl = document.getElementById('gasUrlInput').value.trim();
      await saveSettings();
      toast('บันทึก URL แล้ว');
      renderView();
    });
    document.getElementById('btnTestConn')?.addEventListener('click', async ()=>{
      if(!gasReady()){ toast('กรุณากรอกและบันทึก URL ก่อน'); return; }
      try{
        const data = await gasGet('init');
        toast(data.error? 'เชื่อมต่อไม่สำเร็จ: '+data.error : 'เชื่อมต่อสำเร็จ: '+(data.message||'พร้อมใช้งาน'));
      }catch(e){ toast('เชื่อมต่อไม่สำเร็จ: '+e.message); }
    });
    document.getElementById('btnManualSync')?.addEventListener('click', ()=>syncFromSheet(true));
    document.getElementById('btnImportSeed')?.addEventListener('click', importSeedData);
    document.getElementById('btnImportSeed2569')?.addEventListener('click', ()=>importSeedDataGeneric(SEED_DATA_2569, 'ทะเบียนพนักงานล่าสุด 133 คน'));
    document.getElementById('btnSaveCloudinary')?.addEventListener('click', async ()=>{
      state.settings.cloudinaryCloud = document.getElementById('cldCloud').value.trim();
      state.settings.cloudinaryPreset = document.getElementById('cldPreset').value.trim();
      await saveSettings();
      toast('บันทึกการตั้งค่า Cloudinary แล้ว');
    });
    document.getElementById('btnSaveLogoUrl')?.addEventListener('click', async ()=>{
      state.settings.logoUrl = document.getElementById('logoUrlInput').value.trim();
      await saveSettings();
      renderBrand();
      toast('บันทึกโลโก้แล้ว');
      renderView();
    });
    document.getElementById('logoFileInput')?.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const statusEl = document.getElementById('logoUploadStatus');
      if(!cloudinaryReady()){ toast('กรุณาตั้งค่า Cloudinary ก่อนอัปโหลดไฟล์'); return; }
      statusEl.textContent = 'กำลังอัปโหลด... 0%';
      try{
        const url = await uploadToCloudinary(file, (p)=>{ statusEl.textContent = 'กำลังอัปโหลด... '+p+'%'; });
        state.settings.logoUrl = url;
        await saveSettings();
        renderBrand();
        statusEl.textContent = 'อัปโหลดสำเร็จ';
        toast('อัปโหลดโลโก้สำเร็จ');
        renderView();
      }catch(err){
        statusEl.textContent = '';
        toast('อัปโหลดไม่สำเร็จ: '+err.message);
      }
    });
  }
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeModal(); };
}

/* ================= BOOTSTRAP ================= */
async function init(){
  await loadPersisted();
  renderBrand();
  renderNav();
  renderView();
  updateSyncStatus(gasReady() ? (state.lastSync? 'ok':'none') : 'none');
  if(gasReady()) syncFromSheet(false);
}
init();

</script>
